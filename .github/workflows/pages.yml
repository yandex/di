name: Site

# The landing page and guide under site/, a React project prerendered to
# static HTML and deployed to GitHub Pages. The guide's code blocks are the
# files of examples/guide, imported at build time, so a change there rebuilds
# the site, and the Go CI is what keeps them compiling; the logo under
# docs/assets is imported the same way.
#
# Node 24 is a floor, not a preference: the build and prerender scripts are
# TypeScript run straight by node, which needs its type stripping.
#
# The artifact also carries the coverage report, which is why a change to any
# Go file rebuilds the site: the report is the library's, so it moves when the
# library or its tests do, and narrowing these paths back to site/ would leave
# it showing whenever the site last changed.

on:
  push:
    branches: [main]
    paths: [site/**, examples/guide/**, docs/assets/**, "**/*.go", go.mod, .github/workflows/pages.yml]
  pull_request:
    paths: [site/**, examples/guide/**, docs/assets/**, "**/*.go", go.mod, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run check
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          BASE_PATH: /di
      # Written into the built site, where the README badge links to it. The
      # badge itself states the floor ci.yml enforces rather than this number,
      # which moves a little with every run. The profile covers di, dihttp and
      # dislog: examples/ and benchmarks/ are separate modules and not part of
      # the report.
      - name: coverage report, into the artifact
        run: |
          go test -count=1 -coverprofile=coverage.out ./...
          go tool cover -html=coverage.out -o site/build/coverage.html
          go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
